name: AI Review

# Codex reviews a pull request for correctness and security faults. The `post`
# job turns its findings into one pull request review: each finding is an
# inline comment on its line, so each one opens a review thread that can be
# resolved. This file is the same in every repository that has it. What
# differs per repository is in .github/ai-review-focus.md.
#
# The default for every job. The job that runs the model gets nothing beyond
# this: it cannot write to the pull request. Only the `post` job can.
permissions:
  contents: read

on:
  pull_request:
    branches: [main, dev]
    types: [opened, ready_for_review]
  # The review runs once, when the pull request opens. To run it again after a
  # push, comment `/ai-review` on the pull request.
  issue_comment:
    types: [created]

jobs:
  preflight:
    # A comment event reaches this workflow for every issue in the repository.
    # Act only on a pull request, and only on the command. The `auth` step
    # below decides whether the commenter may run it.
    #
    # A pull request that a bot opens (Dependabot, a GitHub App) starts
    # no review. A bot has no write access, which codex-action requires, and
    # Dependabot reads an empty secret store. A person can still comment
    # `/ai-review` on it.
    #
    # A draft starts no review when it opens. `ready_for_review` starts it,
    # so a draft is reviewed once, when it is ready.
    if: >-
      (github.event_name == 'pull_request'
       && github.event.pull_request.user.type != 'Bot'
       && !github.event.pull_request.draft) ||
      (github.event.issue.pull_request != null
       && startsWith(github.event.comment.body, '/ai-review'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # To mark the command comment as seen. A comment on a pull request is an
      # issue comment, but reacting to it needs `pull-requests: write`:
      # `issues: write` alone returns 403 "Resource not accessible by
      # integration". The model does not run here.
      pull-requests: write
      issues: write
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
      number: ${{ steps.pr.outputs.number }}
      base: ${{ steps.pr.outputs.base }}
      head: ${{ steps.pr.outputs.head }}
    steps:
      # A secret cannot be read from a job-level `if`, so the key is checked
      # here and passed down as an output. The review then skips, rather than
      # fails, until OPENAI_API_KEY is set.
      - id: check
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -n "$OPENAI_API_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::OPENAI_API_KEY is not set. Skipping the review."
          fi

      # `author_association` is affiliation, not access: an organization
      # MEMBER, or a triage COLLABORATOR, can be read-only. Ask for the
      # effective permission instead. `openai/codex-action` runs this same
      # check on itself, so this one only stops the job earlier, before it
      # takes a runner and marks the comment as seen.
      - id: auth
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          ACTOR: ${{ github.event.comment.user.login }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != "issue_comment" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          level=$(gh api \
            "repos/$GITHUB_REPOSITORY/collaborators/$ACTOR/permission" \
            --jq .permission 2>/dev/null || echo none)
          case "$level" in
            admin|maintain|write)
              echo "ok=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::notice::$ACTOR has \"$level\" permission here. Skipping."
              ;;
          esac

      # `pull_request` carries the two commits to compare. `issue_comment`
      # carries neither, so read the pull request from the API for both. Apply
      # the base-branch filter too, which the `pull_request` trigger applies on
      # its own.
      #
      # Review only branches of this repository. A fork's own `pull_request`
      # event gets no secrets, but a `/ai-review` on it would give the key to
      # a job that reads the fork's code.
      - id: pr
        if: steps.auth.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: |
          set -euo pipefail
          pr=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$NUMBER")
          ref=$(jq -r .base.ref <<< "$pr")
          case "$ref" in
            main|dev) ;;
            *)
              echo "::notice::Pull request #$NUMBER targets $ref. Skipping."
              exit 0
              ;;
          esac
          # A deleted fork leaves head.repo null, which is not this repository.
          head_repo=$(jq -r '.head.repo.full_name // ""' <<< "$pr")
          if [ "$head_repo" != "$GITHUB_REPOSITORY" ]; then
            echo "::notice::Pull request #$NUMBER comes from a fork. Skipping."
            exit 0
          fi
          jq -r '"number=\(.number)\nbase=\(.base.sha)\nhead=\(.head.sha)"' <<< "$pr" >> "$GITHUB_OUTPUT"

      # Tell the author the command was heard. The review takes a few minutes.
      # Never fail the job over it: this is cosmetic, and a 403 here used to
      # take the whole review down with it, which made `/ai-review` a no-op.
      - if: github.event_name == 'issue_comment' && steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          COMMENT_ID: ${{ github.event.comment.id }}
        run: |
          gh api --silent -X POST \
            "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID/reactions" \
            -f content=eyes \
            || echo "::warning::Could not react to the command comment. Continuing."

  codex:
    needs: preflight
    # An unresolved pull request means the comment guard let the event through
    # but the pull request was out of scope.
    if: >-
      needs.preflight.outputs.enabled == 'true'
      && needs.preflight.outputs.number != ''
    # A second review of the same pull request replaces the first. The group
    # is on this job and on `post`, not on the workflow, so only a run that
    # passed the `auth` check can join it. A workflow-level group would let
    # anyone who can comment cancel a running review with `/ai-review`.
    #
    # A new run's `codex` cancels the old run's `codex` (so the old `post`
    # never starts) or the old run's `post` (if the old `codex` had ended).
    # The old `post` cannot cancel the new `codex`: it starts only after its
    # own `codex` ends, and the new `codex` has already cancelled that one.
    concurrency:
      group: ai-review-${{ needs.preflight.outputs.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    outputs:
      review: ${{ steps.run_codex.outputs['final-message'] }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The head that preflight read, not the merge ref: a push after
          # preflight must not change what is reviewed, a pull request with a
          # conflict has no merge ref, and the line numbers of the review
          # comments are lines of the head.
          ref: ${{ needs.preflight.outputs.head }}
          # Keep the token out of .git/config. Codex reads files.
          persist-credentials: false
          fetch-depth: 0

      - name: Codex review
        id: run_codex
        uses: openai/codex-action@bdf19a4a223ec2549a3e2274a0cf61556bc07675 # v1.13
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          model: gpt-5.6-sol
          effort: medium
          permission-profile: ":read-only"
          # The answer is JSON, so the `post` job can put each finding on its
          # line. Strict mode needs every property in `required`.
          output-schema: |
            {
              "type": "object",
              "additionalProperties": false,
              "required": ["summary", "findings"],
              "properties": {
                "summary": {"type": "string"},
                "findings": {
                  "type": "array",
                  "items": {
                    "type": "object",
                    "additionalProperties": false,
                    "required": ["path", "line", "severity", "title", "body"],
                    "properties": {
                      "path": {"type": "string"},
                      "line": {"type": "integer"},
                      "severity": {"type": "string", "enum": ["P0", "P1", "P2", "P3"]},
                      "title": {"type": "string"},
                      "body": {"type": "string"}
                    }
                  }
                }
              }
            }
          prompt: |
            Review this pull request for correctness and security faults.

            Read CLAUDE.md first, if it exists. It holds this repository's
            rules. Then read .github/ai-review-focus.md. It lists where this
            repository breaks; look hardest at those. Then read the change:
              git diff ${{ needs.preflight.outputs.base }}...${{ needs.preflight.outputs.head }}

            Rules for the findings:
            - Report only a fault you can name with a file and a line.
            - Do not report style. Do not restate the diff.
            - Do not suggest a rewrite of code that already works.
            - `path` is relative to the repository root, as git prints it.
            - `line` is a line number in the file at the head commit (the
              new side of the diff). Use a line that the diff adds or
              changes when the fault is there. Use the line where the fault
              is, not the start of the function.
            - `severity`: P0 breaks production or leaks a secret, P1 is a
              real bug or a security fault, P2 is a fault with limited
              impact, P3 is minor.
            - `title` is one short sentence. `body` explains the fault and
              the input or state that triggers it. Use Markdown.
            - `summary` is one or two sentences about the change as a whole.
              With no findings, say that you found no faults.

  post:
    needs: [preflight, codex]
    # An empty review posts nothing.
    if: needs.codex.outputs.review != ''
    # The group of `codex`: a newer review cancels this one. See there.
    concurrency:
      group: ai-review-${{ needs.preflight.outputs.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    permissions:
      # To read the diff of the reviewed commits (`compare`). A job-level
      # block replaces the default, so it must name `contents` again.
      contents: read
      pull-requests: write
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          REVIEW: ${{ needs.codex.outputs.review }}
          NUMBER: ${{ needs.preflight.outputs.number }}
          BASE: ${{ needs.preflight.outputs.base }}
          HEAD: ${{ needs.preflight.outputs.head }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const pull_number = Number(process.env.NUMBER);
            const head = process.env.HEAD;
            const title = "## Codex review";

            let review;
            try {
              review = JSON.parse(process.env.REVIEW);
            } catch {
              // Not the schema's JSON: post the text as it is.
              await github.rest.pulls.createReview({
                owner, repo, pull_number, commit_id: head, event: "COMMENT",
                body: `${title}\n\n${process.env.REVIEW}`,
              });
              return;
            }

            // GitHub accepts an inline comment only on a line that the diff
            // shows on its new side: an added line or a context line. Read
            // the diff of the reviewed commits, not the pull request's current
            // one: a push while Codex ran must not move the lines.
            const { data: compare } = await github.rest.repos.compareCommitsWithBasehead({
              owner, repo, basehead: `${process.env.BASE}...${head}`,
            });
            const files = compare.files || [];
            const commentable = new Map();
            for (const file of files) {
              const lines = new Set();
              let line = 0;
              for (const text of (file.patch || "").split("\n")) {
                const hunk = /^@@ -\d+(?:,\d+)? \+(\d+)(?:,\d+)? @@/.exec(text);
                if (hunk) {
                  line = Number(hunk[1]);
                } else if (line > 0 && !text.startsWith("-") && !text.startsWith("\\")) {
                  lines.add(line++);
                }
              }
              commentable.set(file.filename, lines);
            }

            // Codex should give a repository path. Strip a diff prefix
            // (`a/`, `b/`) only when the path as given is not in the diff and
            // the stripped one is: `a/` can be a real directory.
            const normalize = (path) => {
              const p = path.replace(/^\.\//, "");
              const bare = p.replace(/^[ab]\//, "");
              return !commentable.has(p) && commentable.has(bare) ? bare : p;
            };
            const label = (f) => `**${f.severity}: ${f.title}**`;
            const link = (f) =>
              `https://github.com/${owner}/${repo}/blob/${head}/${f.path}#L${f.line}`;
            const inline = [];
            const outside = [];
            for (const finding of review.findings) {
              const f = { ...finding, path: normalize(finding.path) };
              const { path } = f;
              if (commentable.get(path)?.has(f.line)) {
                inline.push({ path, line: f.line, side: "RIGHT", body: `${label(f)}\n\n${f.body}` });
              } else {
                outside.push(f);
              }
            }

            const bodyFor = (list) => {
              let body = `${title}\n\n${review.summary}`;
              if (list.length) {
                body += "\n\nNot on a line of the diff:\n\n" + list
                  .map((f) => `- ${label(f)} [\`${f.path}:${f.line}\`](${link(f)})\n\n  ${f.body.replace(/\n/g, "\n  ")}`)
                  .join("\n");
              }
              return body;
            };

            try {
              await github.rest.pulls.createReview({
                owner, repo, pull_number, commit_id: head, event: "COMMENT",
                body: bodyFor(outside), comments: inline,
              });
            } catch (error) {
              // A line GitHub refuses fails the whole review. Post every
              // finding in the body instead, so none is lost.
              core.warning(`Inline review refused (${error.status}): ${error.message}`);
              await github.rest.pulls.createReview({
                owner, repo, pull_number, commit_id: head, event: "COMMENT",
                body: bodyFor(review.findings.map((f) => ({ ...f, path: normalize(f.path) }))),
              });
            }
