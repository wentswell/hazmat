# Dependabot for hazmat.
#
# Minor and patch updates are grouped into one pull request per ecosystem.
# A major update gets its own pull request, because it needs to be read.
version: 2

updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "wednesday"
      time: "09:00"
      timezone: "America/Denver"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "wednesday"
      time: "09:00"
      timezone: "America/Denver"
    open-pull-requests-limit: 3
    groups:
      actions:
        update-types: ["minor", "patch"]
